<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B00B00">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Labs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Study Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2f4ee; --surface:#ffffff; --ink:#16211a; --muted:#46524a; --border:#6f7d73;
    --note:#1f4430; --note-soft:#e1eae2; --brand:#B00B00; --brand-ink:#B00B00;
    --serif:"Libre Baskerville", Georgia, "Times New Roman", serif;
    --sans:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#121814; --surface:#1b231e; --ink:#f1f5f1; --muted:#bcc8bf; --border:#84958a; --note:#8fc4a4; --note-soft:#24342b; --brand:#B00B00; --brand-ink:#ff8a80; color-scheme:dark; }
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font:400 17px/1.6 var(--sans);
       padding:env(safe-area-inset-top,0px) 0 calc(32px + env(safe-area-inset-bottom,0px))}
  :focus-visible{outline:3px solid var(--note); outline-offset:2px}
  .wrap{max-width:560px; margin:0 auto; padding:28px max(16px, env(safe-area-inset-right,0px)) 0 max(16px, env(safe-area-inset-left,0px))}
  h1{font:700 30px/1.2 var(--serif); margin:0 0 10px; color:var(--brand-ink)}
  p{margin:0 0 14px}
  .muted{color:var(--muted)}
  .courses{display:grid; gap:12px; margin:20px 0}
  .course{display:block; background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:18px; text-decoration:none; color:var(--ink); min-height:72px}
  a.course:hover{border-color:var(--brand)}
  .course b{display:block; font:700 20px/1.3 var(--serif)}
  .course span{display:block; color:var(--muted); font-size:15px; margin-top:4px}
  .course .go{color:var(--brand-ink); font-weight:600; margin-top:10px}
  .course.soon{border-style:dashed}
  .brandbar{display:flex; align-items:center; gap:12px; margin-bottom:12px}
  .brandbar img{width:52px; height:52px; border-radius:12px}
  .brandbar small{display:block; color:var(--muted); font-size:14px}
  .install{display:none; background:var(--surface); border:1.5px solid #B00B00; border-radius:14px; padding:14px 16px; margin:16px 0}
  .install > b{display:block; font:700 17px var(--serif)}
  .install p{margin:6px 0 10px; font-size:15px; color:var(--muted)}
  .install button{font:600 16px var(--sans); background:#B00B00; color:#fff; border:0; border-radius:10px; padding:12px 18px; min-height:46px; cursor:pointer}
  .install .x{background:none; color:var(--muted); border:1.5px solid var(--border); margin-left:8px}
  @media (min-width:900px){ .wrap{max-width:860px} .courses{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<main class="wrap">
  <div class="brandbar"><img src="/icons/icon-192.png" alt="" width="52" height="52"><div><h1 style="margin:0">Study Labs</h1><small>SUNY Cortland</small></div></div>
  <div class="install" id="install" role="region" aria-label="Install the app"><b>Get the Study Labs app</b><p id="install-msg"></p><div id="install-btns"></div></div>
  <p class="muted">Interactive practice spaces for each course: animated lessons, questions that explain themselves, flashcards and self-checks. Not graded. Progress saves on your own device.</p>
  <div class="courses" id="courses"></div>
</main>
<script>
// To add a course: add one line below with its repository name.
const COURSES = [
  {title:"Principles of Macroeconomics", desc:"Lecture labs: money, inflation, GDP, growth, open economy, AD–AS and more.", repo:"Macroeconomics_90873"}
];
const box = document.getElementById("courses");
COURSES.forEach(c => {
  const a = document.createElement(c.repo ? "a" : "div");
  a.className = "course" + (c.repo ? "" : " soon");
  if (c.repo) a.href = "/" + c.repo + "/";
  a.innerHTML = `<b>${c.title}</b><span>${c.desc}</span>${c.repo ? '<span class="go">Open course →</span>' : '<span>Coming soon</span>'}`;
  box.appendChild(a);
});

// ---- installable app ----
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/sw.js");
const instBox = document.getElementById("install"), msg = document.getElementById("install-msg"), btns = document.getElementById("install-btns");
const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let dismissed = false; try { dismissed = localStorage.getItem("install-dismissed") === "1"; } catch(e) {}
const notNow = () => { const x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "Not now"; x.onclick = () => { instBox.style.display = "none"; try { localStorage.setItem("install-dismissed","1"); } catch(e) {} }; return x; };
let deferred = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferred = e; if (standalone || dismissed) return;
  msg.textContent = "Add it to your home screen or desktop: one tap to open, full screen, and labs you’ve opened work offline.";
  const b = document.createElement("button"); b.type = "button"; b.textContent = "Install app";
  b.onclick = async () => { deferred.prompt(); await deferred.userChoice; instBox.style.display = "none"; };
  btns.replaceChildren(b, notNow()); instBox.style.display = "block";
});
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (ios && !standalone && !dismissed){
  msg.innerHTML = "In Safari, tap the <b>Share</b> button, then <b>Add to Home Screen</b>. It opens full screen, and labs you’ve opened work offline.";
  btns.replaceChildren(notNow()); instBox.style.display = "block";
}
</script>
</body>
</html>
